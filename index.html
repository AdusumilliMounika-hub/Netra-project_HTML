<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netra Roboat Monitoring System</title>
    <link rel="stylesheet" href="style.css">
   
</head>
 <body>
    <!--header defines heading of the webpage-->
    <header  class="topbar">

     <!--path 1-->
        <div class="brand">
          <div class="brand-logo">N</div>
    <div>
         <h1>NETRA</h1>
         <p>ROBOAT MISSION CONTROL</p>
      </div>
    </div>

    <!--path 2-->
    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#fleet">Fleet</a>
        <a href="#telemetry">Telemetry</a>
        <a href="#alerts">Alerts</a>
    </nav>

    <!--part 3-->
    <!--displays system status and live clock-->
    <div class="header-right">
        <span class="online-dot"></span>
        <span>SYSTEM ONLINE</span>
        <strong id="clock">--:--:--</strong>
    </div>
    <!--PART 4-->
    <!--opens the mission dispatch group-->
    <button id="dispatch-open" type="button">+DISPATCH MISSION</button>
    </header>

    <!--main content-->
    <main class="page">
        <section class="kpi-grid">
          
            <article class="kpi-card">
                <span>ROVERS ONLINE</span>                
                <h2 id="online-count">6/6</h2>
                <p>Active rover units</p>
            </article>    

            <article class="kpi-card">
                <span>AVERAGE BATTERY</span>                              
                <h2 id="online-count">76%</h2>    
                <p>Fleet battery levels</p>           
            </article>      

             <article class="kpi-card">
                <span>OPEN ALERTS</span>                             
                <h2 id="online-count">0</h2>
                 <p>Requires Attention</p>                 
            </article>   

             <article class="kpi-card">
                <span>DISTANCE TODAY</span>              
                <h2 id="online-count">13.62%</h2>                
                 <p>Total simulated distance </p> 
            </article>         
         </section>
    </main>


   <script src="./script.js"></script>
 </body>
</html><!
